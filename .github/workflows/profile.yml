name: profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/**]

permissions:
  contents: write

concurrency:
  group: profile

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render header, stats and the shipped list
        run: python3 scripts/render.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#c026d3&color_dots=#ebedf0,#d9ccfb,#b69cf6,#8b5cf6,#6d3dd9
            dist/snake-dark.svg?palette=github-dark&color_snake=#f0abfc&color_dots=#161b22,#3b2a6b,#5b3fb0,#7c5ce0,#a78bfa

      - name: Publish the SVGs to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Render ${GITHUB_SHA::7} at $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output

      - name: Commit the shipped list when it changed
        run: |
          git diff --quiet README.md && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update the shipped list" README.md
          git push -q
